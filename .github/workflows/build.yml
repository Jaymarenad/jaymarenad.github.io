name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A8A821: ${{ secrets.A8A821 }}
          B1148A: ${{ secrets.B1148A }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('A8A821', ''), os.environ.get('B1148A', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 62cccc672a0279e9a9f1c3184548fdca6371b6f33af8 -->', a)
          if b:
              patched = patched.replace('<!-- 6bb84a1b6d0ba7312e34 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
